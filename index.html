<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./assets/css/styles.css">

    <script defer src="./assets/js/main.js"></script>

    <title>Calculator</title>
</head>

<body>
    <div class="calculator">
        <div class="calculator__result">0</div>

        <div class="calculator__item">
            <button type="button" id="c" class="calculator__button"><span class="button__text">C</span></button>
        </div>
        <div class="calculator__item">
            <button type="button" id="/" class="calculator__button calculator__button--symbol" style="font-size: 25px;">
                <span class="button__text">/</span>
            </button>
        </div>
        <div class="calculator__item">
            <button type="button" id="*" class="calculator__button calculator__button--symbol">
                <span class="button__text">*</span>
            </button>
        </div>
        <div class="calculator__item">
            <button type="button" id="delete" class="calculator__button calculator__button--symbol">
                <span class="button__text">&#9003</span>
            </button>
        </div>
        <div class="calculator__item">
            <button type="button" id="7" class="calculator__button calculator__button--number">
                <span class="button__text">7</span>
            </button>
        </div>
        <div class="calculator__item">
            <button type="button" id="8" class="calculator__button calculator__button--number">
                <span class="button__text">8</span>
            </button>
        </div>
        <div class="calculator__item">
            <button type="button" id="9" class="calculator__button calculator__button--number">
                <span class="button__text">9</span>
            </button>
        </div>
        <div class="calculator__item">
            <button type="button" id="-" class="calculator__button calculator__button--symbol">
                <span class="button__text">-</span>
            </button>
        </div>
        <div class="calculator__item">
            <button type="button" id="4" class="calculator__button calculator__button--number">
                <span class="button__text">4</span>
            </button>
        </div>
        <div class="calculator__item">
            <button type="button" id="5" class="calculator__button calculator__button--number">
                <span class="button__text">5</span>
            </button>
        </div>
        <div class="calculator__item">
            <button type="button" id="6" class="calculator__button calculator__button--number">
                <span class="button__text">6</span>
            </button>
        </div>
        <div class="calculator__item">
            <button type="button" id="+" class="calculator__button calculator__button--symbol">
                <span class="button__text">&plus;</span>
            </button>
        </div>
        <div class="calculator__item">
            <button type="button" id="1" class="calculator__button calculator__button--number">
                <span class="button__text">1</span>
            </button>
        </div>
        <div class="calculator__item">
            <button type="button" id="2" class="calculator__button calculator__button--number">
                <span class="button__text">2</span>
            </button>
        </div>
        <div class="calculator__item">
            <button type="button" id="3" class="calculator__button calculator__button--number">
                <span class="button__text">3</span>
            </button>
        </div>
        <div class="calculator__item calculator__equal">
            <button type="button" id="equal"
                class="calculator__button calculator__button--symbol calculator__equal--button">
                <span class="button__text">=</span>
            </button>
        </div>
        <div class="calculator__item">
            <button type="button" id="%" class="calculator__button calculator__button--number">
                <span class="button__text">%</span>
            </button>
        </div>
        <div class="calculator__item">
            <button type="button" id="0" class="calculator__button calculator__button--number">
                <span class="button__text">0</span>
            </button>
        </div>
        <div class="calculator__item">
            <button type="button" id="." class="calculator__button calculator__button--number">
                <span class="button__text">.</span>
            </button>
        </div>
    </div>
</body>

</html>
